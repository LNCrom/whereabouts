<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Whereabouts Family Invitation</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="page.mjs"></script>
</head>
<body>
  <main>
    <img src="logo.png" alt="" width="88" height="88">
    <h1>Whereabouts</h1>
    <h2>Family invitation</h2>
    <p id="status" role="status">Checking invitation...</p>
    <a id="open" class="primary" hidden>Open in Whereabouts</a>
    <a href="https://testflight.apple.com/join/dJhEQf75" rel="noreferrer" class="secondary">Install or update with TestFlight</a>
    <button id="copy" hidden>Copy invitation for the app</button>
    <p class="note">Only invited Apple Accounts can join. Your location stays private until you enable sharing.</p>
    <noscript>JavaScript is required to open this invitation. You can still install Whereabouts using the TestFlight link.</noscript>
  </main>
</body>
</html>
